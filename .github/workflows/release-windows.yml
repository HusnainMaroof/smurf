# Builds the Smurf desktop app for Windows (MSI + NSIS installer) and attaches it
# to a draft GitHub release. Run it by pushing a tag like v0.1.0, or by hand from
# the Actions tab (workflow_dispatch). The release stays a draft until you publish it.
name: Release (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm exec vitest run

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'smurf-v__VERSION__' }}
          releaseName: Smurf ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: Windows installers for the Smurf desktop app. Needs smurf-server (Docker) and the host runner; see README.
          releaseDraft: true
          prerelease: false
